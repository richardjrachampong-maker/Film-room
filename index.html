async function ytSearch(q, max = 10) {
  if (ytCache[q]) return ytCache[q];
  const url = "https://www.googleapis.com/youtube/v3/search"
    + "?part=snippet&type=video&videoEmbeddable=true&safeSearch=moderate"
    + "&maxResults=" + max + "&q=" + encodeURIComponent(q) + "&key=" + YT_KEY;
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) {
    const m = data.error.message || "";
    if (/quota/i.test(m)) throw new Error("Out of YouTube searches for today. Resets at midnight Pacific.");
    if (/referer|referrer|blocked|API_KEY/i.test(m)) throw new Error("This key isn't allowed on this address. Check the website restriction in Google Cloud.");
    throw new Error(m || "YouTube search failed.");
  }
  const out = (data.items || []).map((it) => ({
    id: it.id.videoId,
    title: unescapeHTML(it.snippet.title),
    channel: unescapeHTML(it.snippet.channelTitle),
    thumb: (it.snippet.thumbnails && (it.snippet.thumbnails.medium || it.snippet.thumbnails.default) || {}).url,
  })).filter((v) => v.id);
  ytCache[q] = out;
  return out;
}

/* ------------------------ AI ------------------------- */

async function send(messages) {
  const res = await fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages }),
  });
  if (!res.ok) throw new Error("The breakdown service isn't reachable from this site yet.");
  const data = await res.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}
const ask = (content) => send([{ role: "user", content }]);

function toJSON(text) {
  const clean = String(text).replace(/```json/g, "").replace(/```/g, "").trim();
  const a = clean.indexOf("{"), b = clean.lastIndexOf("}");
  if (a === -1 || b === -1) throw new Error("Couldn't read the breakdown. Try again.");
  return JSON.parse(clean.slice(a, b + 1));
}

function Film({ seed, clearSeed }) {
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [vids, setVids] = useState(null);
  const [active, setActive] = useState(null);

  async function run(term) {
    const query = (term !== undefined ? term : q).trim();
    if (!query) return;
    setBusy(true); setErr(""); setVids(null); setActive(null);
    try {
      const list = await ytSearch(query);
      if (!list.length) setErr("Nothing came back for that. Try different words.");
      setVids(list);
      setActive(list[0] || null);
    } catch (e) { setErr(e.message || "Something went wrong."); }
    setBusy(false);
  }

  useEffect(() => {
    if (seed) { setQ(seed); run(seed); clearSeed(); }

  return (
    <div className="fr-page">

          onKeyDown={(e) => e.key === "Enter" && run()} />
        <button className="fr-btn fr-full" onClick={() => run()} disabled={busy || !q.trim()}>
          {busy ? "Pulling film" : "Pull the film"}
        </button>

        {busy && <p className="fr-load">Searching</p>}
        {err && <p className="fr-err">{err}</p>}

        {active && (
          <>
            <p className="fr-eyebrow">Now playing</p>
            <iframe className="fr-player" title={active.title}
              src={"https://www.youtube-nocookie.com/embed/" + active.id}
              allow="accelerometer; encrypted-media; picture-in-picture" allowFullScreen />

async function grabFrames(file, count) {
  count = count || 8;
  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.src = url; video.muted = true; video.playsInline = true; video.preload = "auto";
  try {
    await new Promise((resolve, reject) => {
      video.onloadeddata = resolve;
      video.onerror = () => reject(new Error("This browser can't read that video. MP4 works best."));
      setTimeout(() => reject(new Error("That clip took too long to load. Try a shorter one.")), 20000);
    });
    if (!video.videoWidth) throw new Error("That file has no video track.");
    const canvas = document.createElement("canvas");
    const scale = 560 / video.videoWidth;
    canvas.width = 560; canvas.height = Math.round(video.videoHeight * scale);
    const ctx = canvas.getContext("2d");
    const dur = video.duration || 1;
    const frames = [];
    for (let i = 0; i < count; i++) {
      const t = Math.min(dur * ((i + 0.5) / count), Math.max(dur - 0.05, 0));
      await new Promise((resolve) => { video.onseeked = resolve; video.currentTime = t; });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      frames.push(canvas.toDataURL("image/jpeg", 0.7).split(",")[1]);
    }
    return frames;
  } finally { URL.revokeObjectURL(url); }
}

function Clip() {
  const [file, setFile] = useState(null);
  const [what, setWhat] = useState("");
  const [pos, setPos] = useState("Guard");
  const [lvl, setLvl] = useState("High school");
  const [frames, setFrames] = useState([]);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [diag, setDiag] = useState(null);
  const [plan, setPlan] = useState(null);
  const [thread, setThread] = useState([]);
  const [history, setHistory] = useState([]);
  const [q, setQ] = useState("");
  const [asking, setAsking] = useState(false);
  const input = useRef(null);

  function reset(f) {
    setFile(f); setFrames([]); setDiag(null); setPlan(null);
    setThread([]); setHistory([]); setErr("");
  }

  async function run() {
    if (!file) return;
    setErr(""); setDiag(null); setPlan(null); setThread([]); setFrames([]);
    try {
      setBusy("Pulling frames");
      const f = await grabFrames(file);
      setFrames(f);

      setBusy("Reading the tape");
      const seed = f.map((data) => ({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data } }));
      seed.push({ type:"text", text:
`You are a sharp, blunt basketball skills coach breaking down one player's clip.
These 8 stills are evenly spaced through the clip, in order, frame 1 to 8.
Player: ${lvl} ${pos}. They say the clip is: "${what || "unspecified"}".
Judge only what the stills actually show. If the angle or blur hides the mechanics, say that plainly in "read" rather than guessing.
Reply with ONLY this JSON, no markdown:
{"read":"two sentences on the overall picture","grade":"letter grade like B-","phases":[{"name":"phase of the move","status":"good|ok|fix","detail":"under 22 words"}],"working":["2 things holding up, under 14 words each"],"breaking":[{"frame":3,"issue":"under 18 words","cost":"what this costs in a game, under 12 words"}]}
Exactly 4 phases named for this specific move. Max 3 breaking.` });

      const raw1 = await send([{ role:"user", content: seed }]);
      const d = toJSON(raw1);
      setDiag(d);

      setBusy("Writing the plan");
      const raw2 = await ask(
`A ${lvl} ${pos} filmed "${what || "a rep"}". Your film breakdown found:
${JSON.stringify(d)}

Now give them the work. Reply with ONLY this JSON, no markdown:
{"priority":{"fix":"the one thing to fix first, under 8 words","why":"under 25 words"},"drills":[{"name":"","dose":"sets x reps","cue":"under 12 words","progression":"how it gets harder, under 14 words"}],"weeks":[{"label":"Week 1","focus":"under 12 words","check":"how they know it worked, under 12 words"}],"watch":{"query":"a YouTube search for a pro who does this right","why":"under 16 words"}}
Exactly 3 drills and 2 weeks.`);
      setPlan(toJSON(raw2));
      setHistory([{ role:"user", content: seed }, { role:"assistant", content: raw1 }]);
    } catch (e) { setErr(e.message || "Something went wrong."); }
    setBusy("");
  }

  async function askCoach() {
    if (!q.trim() || asking) return;
    const question = q.trim();
    setQ(""); setAsking(true);
    setThread((t) => t.concat([{ who:"you", text:question }]));
    try {
      const next = history.concat([{ role:"user",
        content: question + "\n\n(Answer as the coach, still looking at those same frames. Plain text, no JSON, under 120 words.)" }]);
      const reply = await send(next);
      setHistory(next.concat([{ role:"assistant", content: reply }]));
      setThread((t) => t.concat([{ who:"coach", text:reply }]));
    } catch (e) {
      setThread((t) => t.concat([{ who:"coach", text: e.message || "That didn't go through. Ask again." }]));
    }
    setAsking(false);
  }

  const flagged = {};
  ((diag && diag.breaking) || []).forEach((b) => { flagged[Number(b.frame)] = true; });

  return (
    <div className="fr-page">
      <div className="fr-wrap fr-narrow">
        <div className="fr-head">
          <h2>My clip</h2>
          <p>Five to fifteen seconds, one rep, filmed from the side. That's all it needs.</p>
        </div>

        <input ref={input} type="file" accept="video/*" style={{ display:"none" }}
          onChange={(e) => reset(e.target.files[0] || null)} />
        <div className="fr-drop" role="button" tabIndex={0}
          onClick={() => input.current.click()}
          onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && input.current.click()}>
          <b>{file ? file.name : "Add a clip"}</b>
          {!file && <span>MP4 works best</span>}
        </div>

        <div style={{ marginTop:16 }}>
          <label className="fr-label" htmlFor="what">What's in the clip?</label>
          <input id="what" className="fr-input" value={what}

        </div>

        <div className="fr-row" data-cols="2" style={{ marginTop:14 }}>
          <div>
            <label className="fr-label" htmlFor="cpos">Position</label>
            <select id="cpos" className="fr-select" value={pos} onChange={(e) => setPos(e.target.value)}>
              <option>Guard</option><option>Wing</option><option>Forward</option><option>Big</option>
            </select>

            <label className="fr-label" htmlFor="clvl">Level</label>
            <select id="clvl" className="fr-select" value={lvl} onChange={(e) => setLvl(e.target.value)}>
              <option>Middle school</option><option>High school</option>
              <option>AAU / travel</option><option>College</option><option>Adult rec</option>
            </select>

            <p className="fr-eyebrow">The frames</p>
            <div className="fr-frames">
              {frames.map((f,i) => (
                <div className="fr-frame" key={i} data-flag={flagged[i+1] ? "1" : "0"}>
                  <img src={"data:image/jpeg;base64," + f} alt={"Frame " + (i+1)} />
                  <b>{String(i+1).padStart(2,"0")}</b>

            </p>
            {thread.map((m,i) => (
              <div className={m.who === "you" ? "fr-msg" : "fr-glass fr-msg"} key={i} data-who={m.who}>{m.text}</div>
            ))}
            {asking && <p className="fr-load">Thinking</p>}
            <div className="fr-ask">
              <input className="fr-input" value={q} placeholder="Why does my elbow drift out?"
                onChange={(e) => setQ(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && askCoach()} />
              <button className="fr-btn" style={{ marginTop:0 }} onClick={askCoach}
                disabled={asking || !q.trim()}>Ask</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ------------------------ APP ------------------------ */

const NAV = [
  { id:"browse", label:"Browse" },
  { id:"film", label:"Pull film" },
  { id:"train", label:"Get better" },
  { id:"clip", label:"My clip" },
];

function App() {
  const [page, setPage] = useState("home");
  const [theme, setTheme] = useState("dark");
  const [seed, setSeed] = useState("");

  useEffect(() => {
    const m = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");
    if (m && m.matches) setTheme("light");
  }, []);

  function go(to) {
    setPage(to);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  return (
    <div className="fr" data-theme={theme}>
      <div className="fr-amb" aria-hidden="true"><i /><i /><i /></div>
      <div className="fr-shell">
        <nav className="fr-nav">
          <div className="fr-navin">
            <button className="fr-brand" onClick={() => go("home")}><i />Film Room</button>
            <div className="fr-links">
              {NAV.map((n) => (
                <button key={n.id} className="fr-link" data-on={page===n.id?"1":"0"}
                  onClick={() => go(n.id)}>{n.label}</button>
              ))}
            </div>
            <button className="fr-sun" onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
              aria-label="Switch theme">{theme === "dark" ? "☀" : "☾"}</button>
          </div>
        </nav>

        {page === "home"   && <Landing go={go} />}
        {page === "browse" && <Browse onPick={(query) => { setSeed(query); go("film"); }} />}
        {page === "film"   && <Film seed={seed} clearSeed={() => setSeed("")} />}
        {page === "train"  && <Train />}
        {page === "clip"   && <Clip />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
