async function grabFrames(file, count) {
  count = count || 8;
  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.src = url;
  video.muted = true;
  video.playsInline = true;
  video.preload = "auto";
  try {
    await new Promise((resolve, reject) => {
      video.onloadeddata = resolve;
      video.onerror = () => reject(new Error("This browser can't read that video. MP4 works best."));
      setTimeout(() => reject(new Error("That clip took too long to load. Try a shorter one.")), 20000);
    });

    const canvas = document.createElement("canvas");
    const scale = 560 / video.videoWidth;
    canvas.width = 560;
    canvas.height = Math.round(video.videoHeight * scale);
    const ctx = canvas.getContext("2d");
    const dur = video.duration || 1;
    const frames = [];
    for (let i = 0; i < count; i++) {
      const t = Math.min(dur * ((i + 0.5) / count), Math.max(dur - 0.05, 0));

        video.onseeked = resolve;
        video.currentTime = t;
