<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<style>

html, body, #root { height: 100%; margin: 0; }
body { background: #EDF0F2; }

.fr[data-theme="dark"] {
  --bg:#070B0E; --text:#EEF3F4; --dim:rgba(238,243,244,.56); --faint:rgba(238,243,244,.30);
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09);
  --edge:rgba(255,255,255,.12); --edge-2:rgba(255,255,255,.20);
  --amber:#FFB627; --cyan:#4ED9E8; --onAmber:#0A1013;
  --blobA:#0E5F70; --blobB:#8A5406; --blobC:#1B2E63; --blobO:.55;
}
.fr[data-theme="light"] {
  --bg:#EDF0F2; --text:#0B1215; --dim:rgba(11,18,21,.60); --faint:rgba(11,18,21,.32);
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.78);
  --edge:rgba(11,18,21,.10); --edge-2:rgba(11,18,21,.18);
  --amber:#B06E00; --cyan:#0A6C7A; --onAmber:#FFFFFF;
  --blobA:#8FD3DE; --blobB:#F3CE8E; --blobC:#AFC0E8; --blobO:.70;
}

.fr { position:relative; min-height:100%; background:var(--bg); color:var(--text);
  font-family:'Barlow',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease; }
/* No overflow rule belongs here. overflow-x on its own turns overflow-y
   into auto, which makes this a scroll container, and a sticky nav inside
   a container that never scrolls simply never sticks. The page bodies
   carry the horizontal guard instead. */
.fr *, .fr *::before, .fr *::after { box-sizing:border-box; }

.fr-amb { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.fr-amb i { position:absolute; display:block; border-radius:50%; filter:blur(90px); opacity:var(--blobO); }
.fr-amb i:nth-child(1){ width:62vw;height:62vw;background:var(--blobA);top:-18vw;left:-14vw;animation:dA 34s ease-in-out infinite alternate; }
.fr-amb i:nth-child(2){ width:54vw;height:54vw;background:var(--blobB);top:28vh;right:-18vw;animation:dB 42s ease-in-out infinite alternate; }
.fr-amb i:nth-child(3){ width:48vw;height:48vw;background:var(--blobC);bottom:-16vw;left:18vw;animation:dC 38s ease-in-out infinite alternate; }
@keyframes dA { to { transform:translate3d(8vw,6vh,0) scale(1.12);} }
@keyframes dB { to { transform:translate3d(-10vw,-8vh,0) scale(1.08);} }
@keyframes dC { to { transform:translate3d(6vw,-6vh,0) scale(1.15);} }

.fr-shell { position:relative; z-index:1; }
.fr-wrap { max-width:940px; margin:0 auto; padding:0 20px; }
.fr-narrow { max-width:660px; }

.fr-glass { background:var(--glass); border:1px solid var(--edge); border-radius:18px;
  backdrop-filter:blur(22px) saturate(1.35); -webkit-backdrop-filter:blur(22px) saturate(1.35);
  box-shadow:0 8px 32px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.10); }

.fr-nav { position:sticky; position:-webkit-sticky; top:0; z-index:40; background:var(--glass);
  transition:transform .24s cubic-bezier(.2,.7,.3,1); will-change:transform;
  backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
  border-bottom:1px solid var(--edge); }
.fr-nav[data-hide="1"] { transform:translateY(-100%); }
@media (prefers-reduced-motion:reduce) { .fr-nav { transition:none; } }
.fr-navin { max-width:940px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px;
  min-width:0; }
.fr-brand { appearance:none; background:none; border:0; padding:0; cursor:pointer; color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:700; font-size:15px;
  letter-spacing:.2em; text-transform:uppercase; white-space:nowrap; }
.fr-brand i { display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--amber); margin-right:8px; vertical-align:2px; }
.fr-links { display:flex; gap:4px; margin-left:auto; overflow-x:auto; scrollbar-width:none;
  min-width:0; -webkit-overflow-scrolling:touch; }
.fr-links::-webkit-scrollbar { display:none; }
.fr-link { appearance:none; background:transparent; border:0; cursor:pointer; color:var(--dim);
  border-radius:999px; white-space:nowrap; font-family:'Outfit',sans-serif;
  font-weight:600; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  padding:7px 13px; transition:background .2s,color .2s; }
.fr-link:hover { color:var(--text); background:var(--glass-2); }
.fr-link[data-on="1"] { color:var(--onAmber); background:var(--amber); }
.fr-link:focus-visible,.fr-brand:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
.fr-sun { appearance:none; cursor:pointer; flex:0 0 auto; background:var(--glass-2);
  border:1px solid var(--edge); color:var(--dim); width:32px; height:32px; border-radius:999px;
  font-size:14px; line-height:1; display:grid; place-items:center; transition:color .2s,border-color .2s; }
.fr-sun:hover { color:var(--text); border-color:var(--edge-2); }
.fr-sun:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

.fr-page { animation:rise .45s cubic-bezier(.2,.7,.3,1) both; padding:26px 0 90px; }
@keyframes rise { from { opacity:0; transform:translate3d(0,14px,0);} }

.fr-hero { padding:8vh 0 4vh; }
.fr-eyeb { font-family:'Outfit',sans-serif; font-size:12px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--amber); margin:0 0 18px; }
.fr-hero h1 { font-family:'Outfit',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(52px,13vw,116px); line-height:.84; letter-spacing:-.015em; margin:0; }
.fr-hero h1 em { font-style:normal; color:var(--amber); }
.fr-lede { font-size:clamp(16px,2.3vw,19px); line-height:1.55; color:var(--dim); max-width:46ch; margin:22px 0 0; }
.fr-cta { display:flex; flex-wrap:wrap; gap:10px; margin-top:30px; }

.fr-btn { appearance:none; border:0; cursor:pointer; border-radius:999px;
  font-family:'Outfit',sans-serif; font-weight:700; font-size:15px;
  letter-spacing:.12em; text-transform:uppercase; padding:14px 26px;
  background:var(--amber); color:var(--onAmber); box-shadow:0 6px 22px rgba(0,0,0,.18);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .2s; }
.fr-btn:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.24); }
.fr-btn[data-ghost="1"] { background:var(--glass); color:var(--text); border:1px solid var(--edge);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:none; }
.fr-btn[data-ghost="1"]:hover { border-color:var(--edge-2); }
.fr-btn:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.fr-btn:disabled { background:var(--glass-2); color:var(--faint); cursor:default; transform:none; box-shadow:none; }
.fr-full { width:100%; margin-top:6px; }

.fr-trio { display:grid; gap:14px; margin-top:12vh; }
@media (min-width:720px){ .fr-trio { grid-template-columns:repeat(auto-fit,minmax(260px,1fr));} }
.fr-card { padding:22px; cursor:pointer; text-align:left; width:100%;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), border-color .25s, background .25s; }
.fr-card:hover { transform:translateY(-4px); border-color:var(--edge-2); background:var(--glass-2); }
.fr-card:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.fr-card h3 { font-family:'Outfit',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; font-size:20px; margin:12px 0 6px; }
.fr-card p { color:var(--dim); font-size:14.5px; line-height:1.55; margin:0; }

.fr-head { margin-bottom:20px; }
.fr-head h2 { font-family:'Outfit',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(28px,6vw,40px); line-height:1; margin:0; }
.fr-head p { color:var(--dim); font-size:15px; margin:8px 0 0; max-width:52ch; }
.fr-eyebrow { font-family:'Outfit',sans-serif; font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--faint); margin:30px 0 12px; }

.fr-pills { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; margin-bottom:20px; }
.fr-pills::-webkit-scrollbar { display:none; }
.fr-pill { appearance:none; cursor:pointer; white-space:nowrap; border-radius:999px;
  background:var(--glass); border:1px solid var(--edge); color:var(--dim);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  font-family:'Outfit',sans-serif; font-weight:600; font-size:13px;
  letter-spacing:.1em; text-transform:uppercase; padding:8px 15px;
  transition:color .2s,border-color .2s,background .2s; }
.fr-pill:hover { color:var(--text); border-color:var(--edge-2); }
.fr-pill[data-on="1"] { background:var(--amber); color:var(--onAmber); border-color:transparent; }
.fr-pill:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

.fr-grid { display:grid; gap:12px; grid-template-columns:repeat(2,1fr); }
@media (min-width:640px){ .fr-grid { grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px){ .fr-grid { grid-template-columns:repeat(4,1fr);} }
.fr-tile { position:relative; overflow:hidden; cursor:pointer; text-align:left; padding:16px 14px 14px;
  min-height:132px; width:100%; display:flex; flex-direction:column; justify-content:flex-end;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), border-color .25s, background .25s; }
.fr-tile:hover { transform:translateY(-4px); border-color:var(--edge-2); background:var(--glass-2); }
.fr-tile:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.fr-tile u { position:absolute; top:-14px; right:-6px; text-decoration:none;
  font-family:'Outfit',sans-serif; font-weight:700; font-size:76px; line-height:1;
  color:var(--text); opacity:.07; letter-spacing:-.04em; pointer-events:none; }
.fr-tile b { font-family:'Outfit',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.04em; font-size:17px; line-height:1.05; position:relative; }
.fr-tile s { text-decoration:none; color:var(--cyan); position:relative;
  font-family:'Outfit',sans-serif; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; margin-top:5px; }

.fr-label { display:block; font-family:'Outfit',sans-serif; font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 7px; }
.fr-input,.fr-select,.fr-area { width:100%; color:var(--text); border-radius:12px;
  background:var(--glass); border:1px solid var(--edge);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  padding:13px 15px; font-family:'Barlow',sans-serif; font-size:15.5px;
  transition:border-color .2s,background .2s; }
.fr-area { resize:vertical; min-height:82px; }
.fr-input::placeholder,.fr-area::placeholder { color:var(--faint); }
.fr-input:focus,.fr-select:focus,.fr-area:focus { outline:none; border-color:var(--amber); background:var(--glass-2); }
.fr-row { display:grid; gap:12px; margin-bottom:14px; }
@media (min-width:560px){ .fr-row[data-cols="2"] { grid-template-columns:1fr 1fr;} }

.fr-drop { border:1px dashed var(--edge-2); border-radius:16px; background:var(--glass);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  padding:34px 18px; text-align:center; color:var(--dim); cursor:pointer;
  transition:border-color .2s,color .2s,background .2s; }
.fr-drop:hover { border-color:var(--amber); color:var(--text); background:var(--glass-2); }
.fr-drop b { display:block; font-family:'Outfit',sans-serif; font-weight:600;
  text-transform:uppercase; letter-spacing:.08em; font-size:16px; color:var(--text); margin-bottom:5px; }

.fr-panel { padding:18px; margin-bottom:12px; }
.fr-read { font-family:'Outfit',sans-serif; font-weight:600;
  font-size:clamp(21px,5vw,28px); line-height:1.12; margin:0; text-transform:uppercase; }
.fr-note { color:var(--dim); font-size:14.5px; line-height:1.55; margin:5px 0 0; }
.fr-solid { color:var(--text); }
.fr-name { font-family:'Outfit',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.04em; font-size:18px; margin:0; }
.fr-dose { font-family:'Outfit',sans-serif; letter-spacing:.1em; font-size:13px;
  color:var(--cyan); text-transform:uppercase; font-variant-numeric:tabular-nums; margin:3px 0 0; }
.fr-cue { font-style:italic; font-size:14.5px; margin:9px 0 0; }
.fr-item { display:flex; gap:13px; align-items:flex-start; }
.fr-item + .fr-item { margin-top:15px; padding-top:15px; border-top:1px solid var(--edge); }

.fr-grade { display:flex; gap:18px; align-items:center; padding:20px; }
.fr-grade b { font-family:'Outfit',sans-serif; font-weight:700; font-size:52px;
  line-height:.78; color:var(--amber); font-variant-numeric:tabular-nums; }

.fr-phase { display:flex; gap:13px; align-items:flex-start; }
.fr-phase + .fr-phase { margin-top:13px; padding-top:13px; border-top:1px solid var(--edge); }
.fr-pip { flex:0 0 9px; height:9px; border-radius:50%; margin-top:7px; }
.fr-phase h4 { font-family:'Outfit',sans-serif; text-transform:uppercase;
  letter-spacing:.08em; font-size:15px; margin:0; }

.fr-week { display:grid; gap:10px; }
.fr-day { padding:14px 16px; }
.fr-day b { font-family:'Outfit',sans-serif; letter-spacing:.14em;
  text-transform:uppercase; font-size:12px; color:var(--amber); }
.fr-day i { font-style:normal; display:block; font-size:15px; margin-top:4px; }

.fr-frames { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.fr-frame { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--edge); transition:border-color .3s; }
.fr-frame img { width:100%; display:block; }
.fr-frame b { position:absolute; top:6px; left:6px; border-radius:999px;
  font-family:'Outfit',sans-serif; font-size:11px; letter-spacing:.1em;
  color:var(--text); background:var(--glass-2); padding:2px 7px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.fr-frame[data-flag="1"] { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
.fr-frame[data-flag="1"] b { color:var(--amber); }

.fr-mark { position:relative; display:inline-flex; width:30px; height:30px;
  align-items:center; justify-content:center; flex:0 0 30px; }
.fr-mark span { font-family:'Outfit',sans-serif; font-weight:700; font-size:15px;
  position:relative; z-index:1; }
.fr-mark svg { position:absolute; inset:0; overflow:visible; }
.fr-mark ellipse { fill:none; stroke-width:2; stroke-linecap:round;
  stroke-dasharray:92; stroke-dashoffset:92; animation:draw .6s ease forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }

/* video results */
.fr-player { width:100%; aspect-ratio:16/9; border:0; display:block; border-radius:16px; background:#000; }
.fr-vids { display:grid; gap:10px; grid-template-columns:1fr; }
@media (min-width:560px){ .fr-vids { grid-template-columns:1fr 1fr; } }
.fr-vid { display:flex; gap:12px; padding:10px; cursor:pointer; text-align:left; width:100%;
  align-items:flex-start; transition:border-color .2s,background .2s,transform .2s; }
.fr-vid:hover { border-color:var(--edge-2); background:var(--glass-2); transform:translateY(-2px); }
.fr-vid:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.fr-vid[data-on="1"] { border-color:var(--amber); }
.fr-vid img { width:104px; flex:0 0 104px; border-radius:9px; display:block; aspect-ratio:16/9; object-fit:cover; }
.fr-vid div { min-width:0; }
.fr-vid h4 { margin:0; font-size:14.5px; line-height:1.35; font-weight:500;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fr-vid p { margin:5px 0 0; font-size:12px; color:var(--dim);
  font-family:'Outfit',sans-serif; letter-spacing:.08em; text-transform:uppercase; }
.fr-link { color:var(--cyan); font-size:13.5px; text-decoration:none; border-bottom:1px solid var(--edge); }
.fr-link:hover { border-color:var(--cyan); }
.fr-chips { display:flex; flex-wrap:wrap; gap:8px; }

.fr-msg { padding:14px 16px; font-size:15px; line-height:1.6; white-space:pre-wrap; margin-bottom:10px; }
.fr-msg[data-who="you"] { background:transparent; border:0; box-shadow:none; backdrop-filter:none;
  -webkit-backdrop-filter:none; border-left:2px solid var(--amber); border-radius:0;
  padding:4px 0 4px 14px; color:var(--dim); }
.fr-ask { display:flex; gap:8px; margin-top:12px; }
.fr-ask .fr-input { flex:1; }

.fr-err { border-left:2px solid var(--amber); padding-left:14px; font-size:14.5px; margin-top:20px; }
.fr-load { color:var(--dim); font-family:'Outfit',sans-serif; letter-spacing:.18em;
  text-transform:uppercase; font-size:13px; margin-top:20px; }
.fr-load::after { content:'_'; animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }

@media (prefers-reduced-motion: reduce) {
  .fr-amb i, .fr-mark ellipse, .fr-load::after, .fr-page { animation:none; }
  .fr-mark ellipse { stroke-dashoffset:0; }
  .fr-card:hover,.fr-tile:hover,.fr-btn:hover,.fr-vid:hover { transform:none; }
}

/* --- back button --- */
.fr-back { appearance:none; cursor:pointer; flex:0 0 auto; background:var(--glass-2);
  border:1px solid var(--edge); color:var(--text); width:32px; height:32px;
  border-radius:999px; font-size:15px; line-height:1; display:grid; place-items:center;
  transition:border-color .2s, background .2s; }
.fr-back:hover { border-color:var(--amber); }
.fr-back:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

/* --- player photos on tiles --- */
.fr-tile[data-photo="1"] { min-height:176px; }
.fr-face { position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 16%; }
.fr-scrim { position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(5,9,12,.94) 0%, rgba(5,9,12,.58) 44%, rgba(5,9,12,.04) 100%); }
.fr-tile[data-photo="0"] .fr-scrim { display:none; }
.fr-tile[data-photo="1"] b { color:#FFFFFF; }
.fr-tile[data-photo="1"] s { color:var(--amber); }

/* --- category scorecard --- */
.fr-cats { display:grid; gap:10px; grid-template-columns:1fr; }
@media (min-width:560px){ .fr-cats { grid-template-columns:1fr 1fr; } }
.fr-cat { padding:14px 16px; }
.fr-cat em { font-style:normal; font-family:'Outfit',sans-serif; font-weight:700;
  font-size:26px; color:var(--amber); line-height:1; float:right; margin-left:12px;
  font-variant-numeric:tabular-nums; }
.fr-cat h4 { margin:0; font-family:'Outfit',sans-serif; text-transform:uppercase;
  letter-spacing:.07em; font-size:15px; }
.fr-cat p { margin:5px 0 0; color:var(--dim); font-size:13.5px; line-height:1.5; }


/* --- player profile --- */
.fr-profile { display:flex; gap:18px; align-items:center; }
.fr-avatar { width:92px; height:92px; flex:0 0 92px; border-radius:20px;
  object-fit:cover; object-position:center 18%; border:1px solid var(--edge);
  background:var(--glass); }

.fr-perks { list-style:none; margin:0; padding:0; }
.fr-perks li { padding:13px 0; border-top:1px solid var(--edge); }
.fr-perks li:first-child { border-top:0; }
.fr-perks b { display:block; font-family:'Outfit',sans-serif; font-weight:600; font-size:15px; }
.fr-perks span { display:block; margin-top:3px; font-size:13.5px; color:var(--dim); }
.fr-trayb.fr-left { color:var(--amber); }
.fr-trayb.fr-left:hover { background:var(--glass-2); }

/* --- the tray sits in the bottom left corner --- */
.fr-tray { left:16px; right:auto; bottom:16px; top:auto; }
.fr-histwrap { left:16px; right:auto; bottom:74px; top:auto; width:290px; }

/* On a phone the nav has to fit the brand, the links and the avatar
   without the avatar ending up against the edge of the glass. */
@media (max-width:760px) {
  /* There is not room for the wordmark, five links and two buttons on a
     phone. The mark alone still says whose app this is. */
  /* Edge padding matches on both sides, and respects the rounded corner
     of the screen on phones that have one. */
  .fr-navin { gap:6px;
    padding:10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left)); }
  .fr-brand { font-size:0; letter-spacing:0; flex:0 0 auto; }
  .fr-brand i { width:10px; height:10px; margin-right:0; vertical-align:middle; }
  /* The links take only what is left after the fixed buttons, and scroll
     inside that. They can never push the avatar off the end. */
  .fr-links { gap:2px; min-width:0; flex:1 1 0; }
  .fr-link { padding:6px 9px; font-size:11.5px; letter-spacing:.05em; flex:0 0 auto; }
  .fr-meter, .fr-sun { flex:0 0 auto; }
  .fr-meter { margin-right:0; }
  /* The gear glyph renders wider than its advance on iOS, so it is drawn
     a little smaller than the circle that holds it. */
  .fr-gear { font-size:13px; line-height:1; overflow:hidden; }
  /* A link scrolled past the edge fades instead of being chopped mid-word. */
  .fr-links { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 14px), transparent);
    mask-image:linear-gradient(to right, #000 calc(100% - 14px), transparent); }
  /* Nothing may make the page wider than the phone. This goes on the page
     bodies, never on an ancestor of the nav: overflow-x on its own turns
     overflow-y into auto, which makes a scroll container and takes the
     sticky nav with it. */
  .fr-blank, .fr-chatpage { overflow-x:clip; }
  .fr-tray { right:12px; max-width:calc(100vw - 24px); }
  .fr-trayin { overflow-x:auto; scrollbar-width:none; }
  .fr-trayin::-webkit-scrollbar { display:none; }

  /* Blank page: the tray floats in the corner, nothing to clash with. */
  .fr-tray { left:12px; right:auto; bottom:14px; top:auto; }
  .fr-histwrap { left:12px; right:12px; width:auto; bottom:72px; top:auto; }

  /* In a chat it now sits in the composer, so it stacks above the input
     instead of covering it, whatever height the disclaimer wraps to. */
  .fr-composer .fr-tray { position:static; left:auto; right:auto; bottom:auto;
    max-width:none; margin:8px 0 0; display:flex; }
  /* the input and the tray read as one block, so no gap above the input */
  .fr-composer .fr-bar { padding:0; margin:0; }
  .fr-composer .fr-trayin { width:100%; }
  .fr-chatpage .fr-histwrap { bottom:auto; top:64px; }
  .fr-chatpage .fr-thread { padding-bottom:290px; }

  /* The row has to fit without scrolling, so the parts of the labels that
     are only nice to have are dropped. The tooltips still say it all. */
  .fr-tail { display:none; }
  .fr-trayin { gap:2px; padding:5px; }
  .fr-modes .fr-pill { padding:6px 10px; font-size:12px; }
  .fr-trayb { padding:6px 9px; font-size:12px; }
  .fr-traydiv { margin:0 2px; }
}
</style>
</head>

const photoCache = {};

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}
async function wikiPhotos(titles) {
  const need = titles.filter(t => t && !(t in photoCache));
  if (!need.length) return photoCache;
  const batches = chunk(need, 40);
  for (let b = 0; b < batches.length; b++) {
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*" + "&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=400" + "&titles=" + encodeURIComponent(batches[b].join("|"));
    try {
      const res = await fetch(url);
      const data = await res.json();
      const q = data.query || {};
      const alias = {};
      (q.normalized || []).forEach(n => {
        alias[n.from] = n.to;
      });
      (q.redirects || []).forEach(r => {
        alias[r.from] = r.to;
      });
      const resolve = t => {
        let cur = t,
          i = 0;
        while (alias[cur] && i++ < 5) cur = alias[cur];
        return cur;
      };
      const byTitle = {};
      Object.keys(q.pages || {}).forEach(k => {
        const p = q.pages[k];
        if (p && p.thumbnail && p.thumbnail.source) byTitle[p.title] = p.thumbnail.source;
      });
      batches[b].forEach(t => {
        photoCache[t] = byTitle[resolve(t)] || null;
      });
    } catch (e) {
      batches[b].forEach(t => {
        photoCache[t] = null;
      });
    }
  }
  return photoCache;
}
async function wikiBio(title) {
  if (title in bioCache) return bioCache[title];

  try {
    const res = await fetch(url);
    const data = await res.json();
    const pages = (data.query || {}).pages || {};
    const first = pages[Object.keys(pages)[0]] || {};
    const text = (first.extract || "").split("\n")[0];
    bioCache[title] = {
      text: text.length > 430 ? text.slice(0, 430).replace(/\s+\S*$/, "") + "\u2026" : text,

  } catch (e) {

      text: "",
      photo: null
    };
  }
  return bioCache[title];
}

function thisMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* Keeps the account's email on its own doc, so an admin can find it
   without knowing the user id. Quietly does nothing if it fails. */
async function stampEmail(user) {
  if (!user || !user.email) return;
  try {
    await fetch(docPath(user.uid) + "?updateMask.fieldPaths=email", {
      method: "PATCH",
      headers: {
        Authorization: "Bearer " + user.token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fields: {
          email: {
            stringValue: String(user.email).trim().toLowerCase()
          }
        }
      })
    });
  } catch (e) {}
}

/* Admin only: find an account's user id from its email. */
async function uidFromEmail(user, email) {

    method: "POST",
    headers: {
      Authorization: "Bearer " + user.token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      structuredQuery: {
        from: [{ collectionId: "users" }],
        where: {
          fieldFilter: {
            field: { fieldPath: "email" },
            op: "EQUAL",
            value: { stringValue: String(email).trim().toLowerCase() }
          }
        },
        limit: 1

  return doc.name.split("/").pop();
}

function chatKey(sport) {

}

}

  } catch (e) {}
}

/* Leaving Train for Players or Games takes the chat off screen, so the
   chat that was open is remembered and put back when they return. */
function openKey(sport) {
  return "fr-openchat-" + (sport || "basketball");
}

    })[0] || null;
  } catch (e) {
    return null;
  }
}

/* Chats also live on the account, so signing in on a phone brings over

function chatField(sport) {
  return "chats_" + String(sport || "basketball").replace(/[^a-z0-9]/gi, "");
}

/* Trimmed so the account document cannot grow without limit. */
function packChats(chats) {
  const out = [];

  for (let i = 0; i < chats.length && budget > 0; i++) {
    const c = chats[i];
    const one = JSON.stringify(c);
    if (one.length > budget) break;
    budget -= one.length;
    out.push(c);
  }
  return JSON.stringify(out);
}

async function pullChats(user, sport) {
  if (!user || !accountsOn()) return null;
  try {
    const res = await fetch(docPath(user.uid), {
      headers: {
        Authorization: "Bearer " + user.token

    });
    if (!res.ok) return null;
    const f = (await res.json()).fields || {};
    const raw = (f[chatField(sport)] || {}).stringValue;
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : null;
  } catch (e) {
    return null;
  }
}
